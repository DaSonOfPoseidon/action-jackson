name: Feature
description: New behaviour or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "A triager adds the `area:*` and `priority:*` labels by hand after the issue is filed, because a form cannot set labels."
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the change belongs.
      options:
        - "api (server/src/ActionJackson.Api)"
        - "edge (server/src/ActionJackson.Edge and deploy/pi)"
        - "data (server/src/ActionJackson.Data: schemas, migrations, seed)"
        - "core (server/src/ActionJackson.Core and contracts/)"
        - "web (apps/web: the Angular apps and shared library)"
        - "deploy (deploy/pc, deploy/pi and the deploy scripts)"
        - "ci (CI workflows and the check and build scripts)"
        - "docs (AGENTS.md, CLAUDE.md, docs/)"
        - "legacy (Next.js, Express and Mongo code, frozen)"
    validations:
      required: true
  - type: textarea
    id: what-and-why
    attributes:
      label: What and why
      description: The behaviour you want, and the reason for it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: How to tell it works, as checks a reviewer can run.
    validations:
      required: false
