name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A missing database fails the data tests in CI (the test fixture only skips locally).
      TEST_DATABASE_URL: Host=localhost;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: server/global.json
      - run: dotnet build server/ActionJackson.slnx
      - run: dotnet format server/ActionJackson.slnx --verify-no-changes --no-restore
      - run: dotnet test server/ActionJackson.slnx --no-build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/deploy-lint.sh

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # --ignore-scripts is fine: mongodb-memory-server downloads its mongod at first use.
      - run: npm ci --ignore-scripts && npm test
      - run: npm ci --ignore-scripts && npm test
        working-directory: frontend

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # The e2e run opens http://<key>.localhost; Chromium maps those names to this address (playwright.config.ts).
      EDGE_ORIGIN: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Angular 22 needs ^22.22.3 || ^24.15.0 || >=26. The same image minor as scripts/node.sh.
          node-version: 24.21.0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: server/global.json
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      # The edge is published with plain dotnet, and its sites are staged by the script the Pi deploy uses.
      - run: dotnet publish server/src/ActionJackson.Edge -c Release -p:UseAppHost=false -o build/e2e/edge
        working-directory: .
      - run: scripts/stage-sites.sh apps/web/dist build/e2e/sites
        working-directory: .
      # A random key for this run: it is not a deploy secret. The API address is one nothing listens on, so the API is down.
      - name: Start the edge
        working-directory: .
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          Edge__Key=$key Edge__WebRoot=$PWD/build/e2e/sites Edge__ApiUrl=http://127.0.0.1:9 \
            HTTP_PORT=8080 TUNNEL_PORT=8081 ASPNETCORE_HTTP_PORTS= \
            nohup dotnet build/e2e/edge/ActionJackson.Edge.dll >build/e2e/edge.log 2>&1 &
      - run: npx playwright install --with-deps chromium
      # The global setup waits until the edge serves a real page of every site, so no sleep is needed here.
      - run: npx playwright test
      - if: failure()
        run: cat ../../build/e2e/edge.log
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
